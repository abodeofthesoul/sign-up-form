<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign-up form</title>
<link href="styles.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

</head>
<body>
<div class="div1">
<div class="logo">
<img  class="img2" src="img/odin-lined.png" alt="odin-lined">
<p class="p1">ODIN</p>
</div>
<p class="p2">Photo by <a class="a2" href="#">Halie West</a> on <a class="a3" href="#">Unsplesh</a></p>

</div>
    <div class="content">
<div class="sign">
<p class="signp">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
    <p class="signp2">Sign up <em>now</em> to get started.</p>
    <p class="signp3">You <em>know</em> you want to.</p>
</div>

<form>
<fieldset>
  <p class="legend">Let's do this!</p>
    <div class="form-row">
        <div class="field">
<label class="label1" for="first_name">FIRST NAME</label>
<input class="input1" type="text" id="first_name" name="first_name" required>
</div>
<div class="field">
<label class="label4" for="last_name">LAST NAME</label>
<input class="input4" type="text" id="last_name" name="last_name">
</div>
</div>
<div class="form-row">
<div class="field">
<label class="label2" for="email">EMAIL</label>
<input class="input2" type="email" id="email" name="email" required>
</div>
<div class="field">
<label class="label5" for="tel">PHONE NUMBER</label>
<input class="input5" type="tel" id="tel" name="tel" required>
</div>
</div>

<div class="form-row">
<div class="field">

<label class="label3" for="password">PASSWORD</label>
<input class="input3" type="password" id="password" name="password" required>
</div>
<div class="field">
<label class="label6" for="password_confirm">CONFIRM PASSWORD</label>
<input class="input6" type="password" id="password_confirm" name="password_confirm" required>
</div>

</div>
</fieldset>
<button class="button1" type="submit">Create Account</button>
     
<p class="create">Already have an account? <a  class="a1" href="#">Log in</a></p>


</form>

</div>


</body>


</html>
